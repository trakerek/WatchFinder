[project]
name = "projektpy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "trakerek", email = "bartoszmalach@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "flet>=0.86.5",
    "google>=3.0.0",
    "google-genai>=2.24.0",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
]

[project.scripts]
projektpy = "projektpy:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
